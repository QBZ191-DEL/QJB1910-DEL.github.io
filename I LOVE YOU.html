<!DOCTYPE html>
 <html lang="zh-CN">
 <head>
     <meta charset="UTF-8">
     <title>给小仙女的一段话</title>
     <style>
         body{
             background:#f8f6f2;
             max-width:600px;
             margin:80px auto;
             padding:0 20px;
             font-size:18px;
             color:#333;
             line-height:1.8;
         }
     </style>
 </head>
 <body>
 <p>我一直相信，所有珍贵的东西，往往都藏在细碎无声的温柔里。生活没有那么多轰轰烈烈的故事，大多都是安静的朝暮，而你的这份心意，就是落在平淡日子里的一份小美好。
 
从前我很少体会这样的感受，不知道被人放在心上是这样一种安静又温暖的体验。它不会让人情绪汹涌，只是慢慢在心底蔓延开来，久久不散。
 
我不善言辞，很多心底的想法都难以完整说出口。但我认真记住了这份温柔，也用心准备了礼物。希望当你收到它的时候，能够明白，我同样会在日常的许多时刻，悄悄想起你。</p>
 </body>

 </html>
